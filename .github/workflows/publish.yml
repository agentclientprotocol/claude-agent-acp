name: Publish and Release
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: Which channel to publish
        required: true
        default: stable
        type: choice
        options:
          - stable
          - preview
      ref:
        description: Tag or commit to publish
        required: true
        type: string
      publish_npm:
        description: Publish the package before updating the registry (stable only)
        required: true
        default: true
        type: boolean

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    environment: release # Optional: for enhanced security
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # Generating a GitHub token, so that PRs and tags created by
      # the release-please-action can trigger actions workflows.
      - name: Generate GitHub token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        id: generate-token
        with:
          # GitHub App ID secret name
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          # GitHub App private key secret name
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        id: release
        with:
          token: ${{ steps.generate-token.outputs.token }}
          # Do not add release-type here. The action ignores config-file whenever
          # release-type is set, which silently disables the pre-1.0 versioning
          # rules in release-please-config.json and lets a breaking change jump
          # straight to 1.0.0. The node release type is declared in that config
          # instead, so nothing is lost by leaving this out.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [release-please]
    if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.channel == 'stable' && inputs.publish_npm) || needs.release-please.outputs.release_created == 'true') }}
    environment: release # Optional: for enhanced security
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "lts/*"
          check-latest: true
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - name: Publish
        id: publish
        run: |
          version="$(node -p "require('./package.json').version")"
          npm publish
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # A manual stable run has no release-please output to say which release it
  # is for, or whether that release still lacks archives. This finds the
  # release for the version at `ref` and lists the archives it lacks, so a
  # hand-made release (docs/RELEASES.md, "The release PR merged but nothing was
  # tagged") gets them, and a complete one is not rebuilt.
  find-release:
    name: Find the release's archives
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'stable' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.find.outputs.tag }}
      build: ${{ steps.find.outputs.build }}
    steps:
      # The workflow's own commit, for scripts/missing-release-archives.sh.
      # `ref` is only read through the API, so nothing from it lands on the
      # runner, and only the tag's commit is ever built.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: List the archives the release lacks
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ inputs.ref }}
        #language=bash
        run: |
          version="$(gh api --method GET "repos/$GH_REPO/contents/package.json" \
            -H "Accept: application/vnd.github.raw+json" -f ref="$REF" --jq .version)"
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if ! missing="$(scripts/missing-release-archives.sh "$tag")"; then
            echo "::error title=No release $tag::'$REF' is version $version, which has no GitHub release. Create it first (docs/RELEASES.md, 'The release PR merged but nothing was tagged')."
            exit 1
          fi

          if [ -z "$missing" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "$tag already has every archive; not rebuilding them." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # binaries.yml builds the tag. A `ref` naming another commit would
          # get archives of a commit it didn't ask for, so refuse it.
          tagged="$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)"
          if [ "$(gh api "repos/$GH_REPO/commits/$REF" --jq .sha)" != "$tagged" ]; then
            echo "::error title=$tag lacks archives::'$REF' is not the commit $tag points to ($tagged). Run again with ref=$tag to build them."
            exit 1
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "$tag lacks $(paste -sd ' ' - <<<"$missing"); building them." >> "$GITHUB_STEP_SUMMARY"

  # Standalone executables for the GitHub release: every stable release from
  # release-please, and a manual stable run whose release lacks some. They
  # don't gate the npm publish: a failed build leaves the release without that
  # platform's archive, fails upload-binaries and holds back the registry
  # update. retry-binaries.yml re-runs the failed jobs, which attaches it.
  build-binaries:
    name: Build binaries
    needs: [release-please, find-release]
    # !cancelled(): on a manual run release-please is skipped, which would skip
    # this job too by default.
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || needs.find-release.outputs.build == 'true') }}
    # The called workflow only reads the repository; upload-binaries does the write.
    permissions:
      contents: read
    uses: ./.github/workflows/binaries.yml
    with:
      upload: true
      # Empty on a push, which builds the release merge commit the run is for.
      ref: ${{ needs.find-release.outputs.tag }}

  # Attaches every archive that built, even when another platform's build
  # failed, so those platforms can download it while the failure is fixed. It
  # succeeds only once the release has every archive, which is what lets the
  # registry update run. It checks the release rather than this run's
  # artifacts, so a re-run after the 7-day artifact retention still completes
  # the release from the archives attached earlier.
  upload-binaries:
    name: Attach binaries to the release
    runs-on: ubuntu-latest
    needs: [release-please, find-release, build-binaries]
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || needs.find-release.outputs.build == 'true') }}
    permissions:
      contents: write
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release-please.outputs.tag_name || needs.find-release.outputs.tag }}
    steps:
      # The workflow's own commit, for scripts/missing-release-archives.sh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # Archives from every attempt of this run that are still within the
      # 7-day retention. With none (every build failed) it downloads nothing.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Attach the archives the release lacks
        #language=bash
        run: |
          # Never replaces an archive the release already has: someone may have
          # downloaded it or the registry may hold its sha256, and a rebuild is
          # not byte-identical. --clobber only replaces an upload that never
          # finished, which the script lists as missing.
          missing="$(scripts/missing-release-archives.sh "$TAG")"
          upload=()
          while read -r name; do
            if [ -n "$name" ] && [ -f "artifacts/$name" ]; then
              upload+=("artifacts/$name")
            fi
          done <<<"$missing"
          if [ "${#upload[@]}" -gt 0 ]; then
            gh release upload "$TAG" "${upload[@]}" --clobber
          fi
      - name: Check the release has every archive
        # Also after a failed upload, so the notice matches what is attached.
        if: ${{ !cancelled() }}
        #language=bash
        run: |
          missing="$(scripts/missing-release-archives.sh "$TAG")"

          # Keep a notice at the top of the release notes while archives are
          # missing, so someone looking for one knows why it isn't there.
          start="<!-- missing-binaries -->"
          end="<!-- /missing-binaries -->"
          body="$(gh release view "$TAG" --json body --jq .body)"
          # The notes without an earlier notice and the blank line after it.
          notes="$(awk -v start="$start" -v end="$end" '
            drop_blank { drop_blank = 0; if ($0 == "") next }
            $0 == start { skip = 1 }
            skip { if ($0 == end) { skip = 0; drop_blank = 1 } next }
            { print }' <<<"$body")"
          if [ -n "$missing" ]; then
            notice="$start"$'\n'"> [!WARNING]"$'\n'"> Not attached yet: $(paste -sd ' ' - <<<"$missing" | sed 's/ /, /g'). They will be attached once their build is fixed."$'\n'"$end"
            notes="$notice"$'\n\n'"$notes"
          fi
          if [ "$notes" != "$body" ]; then
            gh release edit "$TAG" --notes "$notes"
          fi

          if [ -n "$missing" ]; then
            echo "::error title=$TAG lacks archives::The release still lacks $(paste -sd ' ' - <<<"$missing"), so the registry was not updated. retry-binaries.yml re-runs the failed jobs up to twice; after that, run: gh run rerun $GITHUB_RUN_ID --failed --repo $GITHUB_REPOSITORY"
            exit 1
          fi

  # Same shape as publish-npm. Tagging is a separate job, so nothing here needs
  # write access to the repository.
  publish-npm-preview:
    name: Publish preview to npm
    runs-on: ubuntu-latest
    # Every push to main gets a preview without waiting for CI or release-please,
    # except release-please's own release merge, which publishes a stable version.
    # Check the commit author and the generated release subject to avoid publishing
    # the same tree twice; either match is enough to skip the preview.
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.channel == 'preview') ||
        (github.event_name == 'push'
          && github.event.head_commit.author.name != 'acp-release-bot[bot]'
          && !startsWith(github.event.head_commit.message, 'chore(main): release '))
      }}
    # Same environment as the stable job, so the npm trusted-publisher binding holds.
    # It carries no required reviewers, so previews never wait for an approval.
    environment: release
    permissions:
      contents: read
      id-token: write # npm OIDC trusted publishing
    timeout-minutes: 15
    # Serialise previews so two pushes cannot read the same registry state and compute
    # the same -preview.N. Job-level rather than workflow-level: a workflow-level group
    # would also serialise release-please, and cancelling a queued release-please run
    # means a release PR that silently stops updating. The trade-off is that GitHub
    # keeps only one run pending per group, so a third push landing while one preview
    # runs and another waits drops the waiting one — that commit gets no preview, but a
    # version is never reused.
    concurrency:
      group: publish-npm-preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Publish the exact pushed commit, or the explicitly requested manual ref.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          # Brings the tags the version calculation reads as its floor. The repo is a
          # few megabytes packed, so a full fetch is cheap and sidesteps every
          # shallow-clone tag caveat.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "lts/*"
          check-latest: true
          registry-url: "https://registry.npmjs.org"
      # Ahead of the version bump, so this still validates the committed lockfile.
      - run: npm ci
      - name: Compute the preview version
        id: preview
        run: |
          version="$(node scripts/next-preview-version.mjs)"
          sha="$(git rev-parse HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Preview \`$version\` from \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Apply the version to the working tree only
        # Never committed: package.json and .release-please-manifest.json on main stay
        # release-please's to own, and this only changes what goes into the tarball.
        # `npm version` keeps package-lock.json's version fields in step, and
        # --no-git-tag-version skips every git operation.
        run: npm version "${{ steps.preview.outputs.version }}" --no-git-tag-version
      - run: npm run build
      - name: Publish
        id: publish
        # --tag is mandatory: npm publish defaults to `latest` even for a semver
        # prerelease, which would point every plain `npm install` at a preview.
        run: |
          npm publish --tag preview
          echo "published=true" >> "$GITHUB_OUTPUT"
    outputs:
      published: ${{ steps.publish.outputs.published }}
      version: ${{ steps.preview.outputs.version }}
      sha: ${{ steps.preview.outputs.sha }}

  publish-tag-preview:
    name: Tag the published preview
    runs-on: ubuntu-latest
    needs: publish-npm-preview
    if: ${{ needs.publish-npm-preview.outputs.published == 'true' }}
    environment: release
    permissions:
      contents: write # create refs/tags/v<version>
    timeout-minutes: 5
    steps:
      # A re-run carries over the outputs of jobs it did not re-run. If that ever stops
      # holding, fail with the manual recipe rather than tagging the wrong commit.
      - name: Check the publish handed over a version and a commit
        env:
          VERSION: ${{ needs.publish-npm-preview.outputs.version }}
          SHA: ${{ needs.publish-npm-preview.outputs.sha }}
        run: |
          if [ -z "$VERSION" ] || [ -z "$SHA" ]; then
            echo "::error::publish-npm-preview reported version='$VERSION' sha='$SHA'." \
              "Tag it by hand — see docs/RELEASES.md, 'A preview published but the" \
              "commit was not tagged'."
            exit 1
          fi
      - name: Create the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish-npm-preview.outputs.version }}
          SHA: ${{ needs.publish-npm-preview.outputs.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v$VERSION" \
            -f sha="$SHA"
          echo "Tagged \`v$VERSION\` at \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

  trigger-registry-update:
    # A stable release dispatches only once its release has every archive:
    # upload-binaries found them all attached, or find-release found nothing
    # missing.
    # The registry takes each archive's sha256 from the release assets when it
    # bumps the version, and rejects the update while one is missing. Previews
    # are npm-only and dispatch without archives.
    needs: [publish-npm, publish-npm-preview, find-release, upload-binaries]
    # Both channels dispatch this: the registry has its own handling for preview
    # versions. The two never fire together — a release merge publishes stable and
    # skips the preview, and every other push does the reverse — so the registry sees
    # exactly one dispatch per published version. The payload is deliberately
    # unchanged: it names no version, and the registry resolves what it needs itself.
    if: >-
      ${{
        always() && (
          needs.publish-npm-preview.outputs.published == 'true'
          || (
            (needs.publish-npm.result == 'success'
              || (github.event_name == 'workflow_dispatch' && inputs.channel == 'stable' && !inputs.publish_npm))
            && (needs.upload-binaries.result == 'success' || needs.find-release.outputs.build == 'false')
          )
        )
      }}
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    # npm metadata is normally visible within about five minutes. Leave 2.5x that
    # window for propagation, plus enough time to mint the token and dispatch.
    timeout-minutes: 15
    steps:
      - name: Wait for package to become available
        if: ${{ needs.publish-npm.result == 'success' || needs.publish-npm-preview.outputs.published == 'true' }}
        env:
          PACKAGE: "@agentclientprotocol/claude-agent-acp"
          VERSION: ${{ needs.publish-npm-preview.outputs.version || needs.publish-npm.outputs.version }}
        #language=bash
        run: |
          if [ -z "$VERSION" ]; then
            echo "::error::The publish job did not report a package version."
            exit 1
          fi

          deadline=$((SECONDS + 750))
          while (( SECONDS < deadline )); do
            if timeout 10s npm pack "$PACKAGE@$VERSION" \
              --dry-run \
              --ignore-scripts \
              --silent \
              --registry=https://registry.npmjs.org \
              --prefer-online \
              --fetch-retries=0 >/dev/null 2>&1; then
              echo "$PACKAGE@$VERSION is available from npm."
              exit 0
            fi

            remaining=$((deadline - SECONDS))
            if (( remaining > 0 )); then
              echo "Waiting for $PACKAGE@$VERSION to become available (${remaining}s remaining)..."
              sleep 10
            fi
          done

          echo "::error::$PACKAGE@$VERSION was not available from npm after 12.5 minutes."
          exit 1

      - name: Generate token scoped to the registry repo
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        id: registry-token
        with:
          app-id: ${{ secrets.REGISTRY_UPDATER_APP_ID }}
          private-key: ${{ secrets.REGISTRY_UPDATER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: registry

      - name: Dispatch registry version update
        env:
          GH_TOKEN: ${{ steps.registry-token.outputs.token }}
        run: |
          gh workflow run update-versions.yml \
            --repo ${{ github.repository_owner }}/registry \
            --ref main \
            -f apply=true \
            -f agents=claude-acp
